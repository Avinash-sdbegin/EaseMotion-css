<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
3D Rotating Cube Navigation
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


<h1>
Cube Navigation
</h1>

<p>
Interactive 3D glassmorphic menu
</p>



<div class="scene">


<div class="cube" id="cube">


<div class="face front">
Home
</div>


<div class="face back">
About
</div>


<div class="face right">
Projects
</div>


<div class="face left">
Services
</div>


<div class="face top">
Contact
</div>


<div class="face bottom">
More
</div>


</div>


</div>



<div class="controls">

<button data-rotate="0">
Home
</button>

<button data-rotate="90">
Projects
</button>

<button data-rotate="180">
About
</button>

<button data-rotate="270">
Contact
</button>

</div>


</main>



<script src="script.js"></script>


</body>

</html>

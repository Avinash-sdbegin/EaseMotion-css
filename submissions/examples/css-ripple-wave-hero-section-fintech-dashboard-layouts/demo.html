<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CSS Ripple-Wave Hero Section | EaseMotion</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="hero">

    <div class="ripple ripple-one"></div>
    <div class="ripple ripple-two"></div>
    <div class="ripple ripple-three"></div>

    <section class="hero-content">

      <span class="badge">
        Fintech Dashboard
      </span>

      <h1>
        Smart Financial Insights
        <span>Powered by Motion</span>
      </h1>

      <p>
        Experience a modern fintech dashboard interface with
        smooth ripple-wave animations built using pure CSS.
      </p>

      <div class="hero-actions">
        <button class="primary-btn">
          Get Started
        </button>

        <button class="secondary-btn">
          Explore Features
        </button>
      </div>

      <div class="stats">

        <article class="stat-card">
          <h3>$2.4M+</h3>
          <p>Transactions</p>
        </article>

        <article class="stat-card">
          <h3>99.9%</h3>
          <p>Uptime</p>
        </article>

        <article class="stat-card">
          <h3>24/7</h3>
          <p>Analytics</p>
        </article>

      </div>

    </section>


    <section class="dashboard-preview">

      <div class="dashboard-card">

        <div class="card-header">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="chart">

          <div class="bar bar-one"></div>
          <div class="bar bar-two"></div>
          <div class="bar bar-three"></div>
          <div class="bar bar-four"></div>

        </div>

        <div class="balance">
          <small>Total Balance</small>
          <h2>$84,520.00</h2>
        </div>

      </div>

    </section>

  </main>


</body>
</html>

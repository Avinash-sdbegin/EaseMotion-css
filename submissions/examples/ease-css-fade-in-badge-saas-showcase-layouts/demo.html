<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fade-In Badge - SaaS Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


<main class="container">


    <section class="hero">


        <div class="badge">

            <span class="dot"></span>

            New SaaS Platform Available

        </div>



        <h1>

            Build Faster With

            <span>
                Smart SaaS Solutions
            </span>

        </h1>


        <p>

            Create powerful digital experiences with
            modern cloud tools, automation and analytics.

        </p>


        <div class="actions">

            <button>
                Start Building
            </button>

            <button class="outline">
                Explore Features
            </button>

        </div>


    </section>



    <section class="showcase">


        <div class="card">

            <h3>
                Cloud Analytics
            </h3>

            <p>
                Real-time insights for your business.
            </p>

        </div>



        <div class="card">

            <h3>
                Automation
            </h3>

            <p>
                Improve workflow efficiency.
            </p>

        </div>



        <div class="card">

            <h3>
                Team Growth
            </h3>

            <p>
                Scale your SaaS product easily.
            </p>

        </div>


    </section>


</main>


</body>

</html>

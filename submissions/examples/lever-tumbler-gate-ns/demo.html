<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="CSS-only Lever Tumbler Gate animation for EaseMotion CSS."
  >

  <title>Lever Tumbler Gate</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="demo" aria-labelledby="title">

      <div class="intro">
        <p class="eyebrow">EaseMotion CSS · Issue #77696</p>

        <h1 id="title">Lever Tumbler Gate</h1>

        <p class="description">
          A CSS-only mechanical animation inspired by lever tumblers
          aligning around a central bolt.
        </p>
      </div>

      <section
        class="ease-lever-tumbler-gate"
        aria-label="Animated lever tumbler gate"
      >

        <div class="ease-lever-tumbler-gate__housing">

          <div class="ease-lever-tumbler-gate__bezel">

            <div class="ease-lever-tumbler-gate__face">

              <div
                class="ease-lever-tumbler-gate__motion"
                aria-hidden="true"
              >
                <span class="ease-lever-tumbler-gate__a"></span>
                <span class="ease-lever-tumbler-gate__b"></span>
                <span class="ease-lever-tumbler-gate__c"></span>
                <span class="ease-lever-tumbler-gate__d"></span>
              </div>

              <div
                class="ease-lever-tumbler-gate__bolt"
                aria-hidden="true"
              ></div>

              <div
                class="ease-lever-tumbler-gate__bolt-head"
                aria-hidden="true"
              ></div>

              <div
                class="ease-lever-tumbler-gate__lever lever-a"
                aria-hidden="true"
              >
                <span></span>
              </div>

              <div
                class="ease-lever-tumbler-gate__lever lever-b"
                aria-hidden="true"
              >
                <span></span>
              </div>

              <div
                class="ease-lever-tumbler-gate__lever lever-c"
                aria-hidden="true"
              >
                <span></span>
              </div>

              <div
                class="ease-lever-tumbler-gate__lever lever-d"
                aria-hidden="true"
              >
                <span></span>
              </div>

              <div
                class="ease-lever-tumbler-gate__gate"
                aria-hidden="true"
              >
                <span></span>
              </div>

            </div>
          </div>
        </div>

      </section>

      <div class="status">
        <span class="status-dot" aria-hidden="true"></span>
        Tumblers aligning
      </div>

    </section>
  </main>
</body>
</html>

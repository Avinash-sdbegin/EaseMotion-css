<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ease Eggbeater Whisk Spin</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="ease-eggbeater-whisk-spin">

  <div class="mixer-panel">

    <h2>HAND EGG BEATER</h2>
    <p>TWIN WHISK ROTATION SYSTEM</p>

    <div class="eggbeater">

      <div class="gear gear-one"></div>
      <div class="gear gear-two"></div>

      <div class="handle"></div>

      <div class="whisk whisk-left">
        <span></span>
      </div>

      <div class="whisk whisk-right">
        <span></span>
      </div>

    </div>

    <div class="status">
      <span></span>
      MIXING ACTIVE
    </div>

  </div>

</div>

</body>
</html>

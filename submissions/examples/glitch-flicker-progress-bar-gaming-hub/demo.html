<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion CSS - Glitch Flicker Progress Bars</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>⚡ Glitch Flicker Progress Bars</h1>
    <p class="subtitle">
        Futuristic gaming hub inspired loading indicators built using pure HTML & CSS.
    </p>

    <div class="progress-card">

        <div class="progress-item">
            <div class="progress-info">
                <span>Mission Progress</span>
                <span>92%</span>
            </div>

            <div class="glitch-progress cyan" style="--progress:92%;">
                <span class="glitch-fill"></span>
            </div>
        </div>

        <div class="progress-item">
            <div class="progress-info">
                <span>Weapon Upgrade</span>
                <span>74%</span>
            </div>

            <div class="glitch-progress purple" style="--progress:74%;">
                <span class="glitch-fill"></span>
            </div>
        </div>

        <div class="progress-item">
            <div class="progress-info">
                <span>Energy Charge</span>
                <span>58%</span>
            </div>

            <div class="glitch-progress green" style="--progress:58%;">
                <span class="glitch-fill"></span>
            </div>
        </div>

        <div class="progress-item">
            <div class="progress-info">
                <span>System Sync</span>
                <span>38%</span>
            </div>

            <div class="glitch-progress orange" style="--progress:38%;">
                <span class="glitch-fill"></span>
            </div>
        </div>

    </div>
</div>

</body>
</html>

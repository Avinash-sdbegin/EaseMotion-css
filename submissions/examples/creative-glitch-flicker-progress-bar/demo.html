<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Glitch-Flicker Progress Bar | EaseMotion CSS
    </title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<main class="container">

    <section class="hero">

        <span class="badge">
            EaseMotion CSS
        </span>

        <h1>
            Glitch-Flicker Progress Bar
        </h1>

        <p>
            A futuristic CSS-only dashboard progress bar
            with glitch flicker animation and responsive design.
        </p>

    </section>


    <section class="dashboard">


        <article class="progress-card">

            <div class="header">

                <h2>
                    System Performance
                </h2>

                <span>
                    85%
                </span>

            </div>


            <div class="progress">

                <div class="progress-fill"></div>

            </div>

        </article>



        <article class="progress-card">

            <div class="header">

                <h2>
                    Data Processing
                </h2>

                <span>
                    70%
                </span>

            </div>


            <div class="progress">

                <div class="progress-fill second"></div>

            </div>

        </article>



        <article class="progress-card">

            <div class="header">

                <h2>
                    Network Status
                </h2>

                <span>
                    95%
                </span>

            </div>


            <div class="progress">

                <div class="progress-fill third"></div>

            </div>

        </article>


    </section>


</main>


</body>

</html>

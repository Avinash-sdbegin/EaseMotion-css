<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Northern Lights Curtain</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="northern-wrapper" aria-label="Animated northern lights curtain">

  <section class="aurora-card">

    <h1>CSS Northern Lights Curtain</h1>
    <p>Pure CSS Aurora Borealis Flow</p>

    <div class="aurora-sky">

      <div class="aurora aurora-one"></div>
      <div class="aurora aurora-two"></div>
      <div class="aurora aurora-three"></div>

      <div class="stars"></div>

    </div>

    <div class="status">
      <span></span>
      AURORA ACTIVE
    </div>

  </section>

</main>

</body>
</html>

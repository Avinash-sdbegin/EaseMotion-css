<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Floating cookie banner with gradient glow styling built with pure HTML and CSS"
    >

    <title>Floating Gradient Cookie Banner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="gradient-cookie-page">

        <section
            class="cookie-banner"
            aria-labelledby="cookie-title"
        >

            <div
                class="cookie-banner__ambient cookie-banner__ambient--one"
                aria-hidden="true"
            ></div>

            <div
                class="cookie-banner__ambient cookie-banner__ambient--two"
                aria-hidden="true"
            ></div>


            <div class="cookie-banner__glow-border" aria-hidden="true"></div>


            <div class="cookie-banner__icon" aria-hidden="true">

                <div class="cookie-icon">

                    <span class="cookie-icon__chip cookie-icon__chip--one"></span>
                    <span class="cookie-icon__chip cookie-icon__chip--two"></span>
                    <span class="cookie-icon__chip cookie-icon__chip--three"></span>
                    <span class="cookie-icon__chip cookie-icon__chip--four"></span>

                    <span class="cookie-icon__bite"></span>

                </div>

            </div>


            <div class="cookie-banner__body">

                <span class="cookie-banner__eyebrow">
                    PRIVACY &amp; COOKIES
                </span>

                <h1 id="cookie-title">
                    A little cookie
                    <span class="gradient-text">magic</span>
                </h1>

                <p>
                    We use cookies to keep the experience smooth,
                    understand how visitors use our site, and
                    personalize your journey. Choose what works
                    best for you.
                </p>

                <div class="cookie-banner__meta">

                    <span>
                        <span
                            class="meta-dot meta-dot--green"
                            aria-hidden="true"
                        ></span>

                        Essential cookies always active
                    </span>

                    <a href="#cookie-preferences">
                        Privacy policy
                        <span aria-hidden="true">↗</span>
                    </a>

                </div>

            </div>


            <div class="cookie-banner__actions">

                <button
                    type="button"
                    class="cookie-button cookie-button--outline"
                >
                    Settings
                </button>

                <button
                    type="button"
                    class="cookie-button cookie-button--ghost"
                >
                    Reject
                </button>

                <button
                    type="button"
                    class="cookie-button cookie-button--gradient"
                >
                    Accept all
                    <span aria-hidden="true">✓</span>
                </button>

            </div>


            <div
                class="cookie-banner__progress"
                aria-hidden="true"
            >
                <span></span>
            </div>

        </section>


        <section
            id="cookie-preferences"
            class="preferences"
            aria-labelledby="preferences-title"
        >

            <div class="preferences__header">

                <div>
                    <span class="preferences__eyebrow">
                        COOKIE PREFERENCES
                    </span>

                    <h2 id="preferences-title">
                        Your choices
                    </h2>
                </div>

                <span class="preferences__badge">
                    Customizable
                </span>

            </div>


            <div class="preferences__grid">

                <label class="preference">

                    <span class="preference__content">

                        <span
                            class="preference__icon"
                            aria-hidden="true"
                        >
                            ✓
                        </span>

                        <span class="preference__text">

                            <strong>
                                Essential
                            </strong>

                            <small>
                                Required for core functionality
                            </small>

                        </span>

                    </span>

                    <span class="preference__required">
                        Required
                    </span>

                </label>


                <label class="preference">

                    <span class="preference__content">

                        <span
                            class="preference__icon preference__icon--purple"
                            aria-hidden="true"
                        >
                            ◌
                        </span>

                        <span class="preference__text">

                            <strong>
                                Analytics
                            </strong>

                            <small>
                                Help us improve your experience
                            </small>

                        </span>

                    </span>


                    <span class="toggle">

                        <input
                            type="checkbox"
                            checked
                        >

                        <span
                            class="toggle__track"
                            aria-hidden="true"
                        >
                            <span class="toggle__thumb"></span>
                        </span>

                    </span>

                </label>


                <label class="preference">

                    <span class="preference__content">

                        <span
                            class="preference__icon preference__icon--cyan"
                            aria-hidden="true"
                        >
                            ✦
                        </span>

                        <span class="preference__text">

                            <strong>
                                Personalization
                            </strong>

                            <small>
                                Remember your preferences
                            </small>

                        </span>

                    </span>


                    <span class="toggle">

                        <input type="checkbox">

                        <span
                            class="toggle__track"
                            aria-hidden="true"
                        >
                            <span class="toggle__thumb"></span>
                        </span>

                    </span>

                </label>

            </div>


            <button
                type="button"
                class="save-button"
            >
                Save preferences
            </button>

        </section>

    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Hidden Gesture Nav</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="edge-trigger" aria-hidden="true"></div>

    <nav class="gesture-nav" aria-label="Hidden Gesture Navigation">
        <a href="#" tabindex="0">Home</a>
        <a href="#" tabindex="0">About</a>
        <a href="#" tabindex="0">Services</a>
        <a href="#" tabindex="0">Contact</a>
    </nav>


    <main class="content">

        <h1>Hidden Gesture Navigation</h1>

        <p>
            Move your cursor near the left edge to reveal the navigation.
        </p>

    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fade-In Dropdown Product Catalog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="catalog">

    <h1>Product Catalog</h1>
    <p class="subtitle">
        CSS Fade-In Dropdown Menu
    </p>


    <div class="dropdown">

        <button class="drop-btn">
            Select Category ▼
        </button>


        <div class="dropdown-menu">

            <a href="#">
                Electronics
            </a>

            <a href="#">
                Fashion
            </a>

            <a href="#">
                Accessories
            </a>

            <a href="#">
                Gaming
            </a>

        </div>

    </div>


    <div class="products">

        <div class="card">
            <h2>Laptop</h2>
            <p>Premium performance device</p>
        </div>


        <div class="card">
            <h2>Smart Watch</h2>
            <p>Modern wearable technology</p>
        </div>


        <div class="card">
            <h2>Headphones</h2>
            <p>Immersive audio experience</p>
        </div>

    </div>

</section>

</body>
</html>

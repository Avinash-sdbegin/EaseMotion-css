<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Neon Floating Label Input
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


<div class="card">


<h1>
Neon Login
</h1>


<p>
Animated floating label input field
</p>



<form>


<div class="input-box">

<input 
type="text" 
id="username"
required
>


<label for="username">
Username
</label>


</div>



<div class="input-box">

<input 
type="email" 
id="email"
required
>


<label for="email">
Email Address
</label>


</div>



<div class="input-box">

<input 
type="password" 
id="password"
required
>


<label for="password">
Password
</label>


</div>



<button>
Continue
</button>


</form>


</div>


</main>


<script src="script.js"></script>


</body>

</html>

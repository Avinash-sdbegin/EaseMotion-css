<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Origami Fold Card</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<main class="wrapper">

  <section class="origami-card" tabindex="0" aria-label="Origami Fold Card">

    <div class="fold top-fold"></div>

    <div class="card-content">
      <h1>Origami Card</h1>
      <p>
        A beautiful card that unfolds from a folded paper style using pure CSS.
      </p>

      <button>
        Explore
      </button>
    </div>

    <div class="fold left-fold"></div>
    <div class="fold right-fold"></div>

  </section>

</main>

</body>
</html>

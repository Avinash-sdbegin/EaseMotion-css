<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Responsive 3D gradient navbar built with HTML and CSS."
  />

  <title>3D Gradient Navbar</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section class="showcase" aria-labelledby="navbar-title">

      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>
      <div class="grid" aria-hidden="true"></div>

      <div class="hero-copy">
        <p class="eyebrow">NEXT-GEN INTERFACE</p>

        <h1 id="navbar-title">
          3D <span>Gradient</span> Navbar
        </h1>

        <p class="description">
          A futuristic navigation bar combining layered depth,
          vibrant gradients, soft glass effects, and responsive
          CSS interactions.
        </p>
      </div>

      <nav class="navbar" aria-label="Primary navigation">
        <a class="brand" href="#" aria-label="Nova home">
          <span class="brand-mark" aria-hidden="true">
            N
          </span>

          <span class="brand-text">
            NOVA
          </span>
        </a>

        <div class="nav-links">
          <a class="nav-link active" href="#home">
            Home
          </a>

          <a class="nav-link" href="#explore">
            Explore
          </a>

          <a class="nav-link" href="#projects">
            Projects
          </a>

          <a class="nav-link" href="#about">
            About
          </a>
        </div>

        <a class="nav-action" href="#contact">
          <span>Contact</span>
          <span aria-hidden="true">↗</span>
        </a>
      </nav>

      <div class="floating-chip chip-one" aria-hidden="true">
        <span class="chip-dot"></span>
        LIVE
      </div>

      <div class="floating-chip chip-two" aria-hidden="true">
        <span>+</span>
        3D
      </div>

      <div class="corner corner-top-left" aria-hidden="true"></div>
      <div class="corner corner-top-right" aria-hidden="true"></div>
      <div class="corner corner-bottom-left" aria-hidden="true"></div>
      <div class="corner corner-bottom-right" aria-hidden="true"></div>

    </section>
  </main>
</body>
</html>

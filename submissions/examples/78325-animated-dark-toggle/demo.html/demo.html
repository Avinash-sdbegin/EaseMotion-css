<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Animated responsive dark mode toggle built with HTML and CSS"
  >

  <title>Animated Dark Mode Toggle</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="showcase" aria-labelledby="title">
      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="title">Animated Dark Mode Toggle</h1>

      <p class="description">
        A responsive CSS-only toggle with smooth animation and
        dark mode inspired styling.
      </p>

      <div class="toggle-card">
        <div class="mode-info">
          <span class="mode-icon" aria-hidden="true">☾</span>

          <div>
            <strong>Dark mode</strong>
            <span>Switch appearance</span>
          </div>
        </div>

        <label class="toggle" aria-label="Toggle dark mode">
          <input type="checkbox">

          <span class="track">
            <span class="sun" aria-hidden="true">☀</span>
            <span class="moon" aria-hidden="true">☾</span>

            <span class="thumb">
              <span class="thumb-icon" aria-hidden="true">☀</span>
            </span>
          </span>
        </label>
      </div>

      <p class="hint">
        Click the toggle to preview the animated state.
      </p>
    </section>
  </main>
</body>
</html>

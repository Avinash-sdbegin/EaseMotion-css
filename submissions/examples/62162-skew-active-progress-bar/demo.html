<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skew Active Progress Bar | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <h1>Skew Active Progress Bar</h1>
    <p class="subtitle">
        Pure CSS animated progress bar for modern SaaS showcase layouts.
    </p>

    <section class="progress-card">

        <div class="header">
            <span>Project Completion</span>
            <strong>78%</strong>
        </div>

        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>

        <div class="stats">
            <div>
                <h3>24</h3>
                <p>Tasks Done</p>
            </div>

            <div>
                <h3>8</h3>
                <p>Remaining</p>
            </div>

            <div>
                <h3>92%</h3>
                <p>Efficiency</p>
            </div>
        </div>

    </section>

</main>

</body>
</html>

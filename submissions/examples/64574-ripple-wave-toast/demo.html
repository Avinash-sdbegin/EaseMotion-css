<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripple Wave Toast | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Ripple Wave Toast</h1>
        <p class="subtitle">
            Pure CSS animated toast notification with ripple effects.
        </p>

        <div class="toast">
            <div class="ripple"></div>

            <div class="icon">
                ✓
            </div>

            <div class="content">
                <h2>Success</h2>
                <p>Your changes have been saved.</p>
            </div>
        </div>

    </main>

</body>
</html>
